version: "3"

vars:
  IMAGE: wearable-risk-pipeline
  CONTAINER: wearable-risk-pipeline
  # Placeholder -- replace with the real location of the data archive.
  # The archive must contain x_test.npy, model_I2O.checkpoint and raw_sessions/ at its top level.
  DATA_URL: '{{.DATA_URL | default "https://example.com/wearable_risk_pipeline/data.tar.gz"}}'

tasks:
  setup:
    desc: Download and extract the input data into ./data
    cmds:
      - mkdir -p data
      - curl -fL --progress-bar -o data/data.tar.gz "{{.DATA_URL}}"
      - tar -xzf data/data.tar.gz -C data
      - rm data/data.tar.gz
    status:
      - test -f data/x_test.npy
      - test -f data/model_I2O.checkpoint
      - test -d data/raw_sessions

  build:
    desc: Build the Docker image
    cmds:
      - docker build -t {{.IMAGE}} .

  up:
    desc: Build the image and run the full pipeline (extra flags go after --, e.g. task up -- --draws 20)
    deps: [build]
    preconditions:
      - sh: test -f data/x_test.npy
        msg: "data/ is missing -- run `task setup` first"
    cmds:
      - mkdir -p output
      - docker rm -f {{.CONTAINER}} >/dev/null 2>&1 || true
      - >-
        docker run -d --name {{.CONTAINER}}
        --user "$(id -u):$(id -g)"
        -v "{{.ROOT_DIR}}/data:/app/data:ro"
        -v "{{.ROOT_DIR}}/output:/app/output"
        {{.IMAGE}} {{.CLI_ARGS}}
      - docker logs -f {{.CONTAINER}}

  down:
    desc: Stop and remove the pipeline container
    cmds:
      - docker rm -f {{.CONTAINER}} >/dev/null 2>&1 || true

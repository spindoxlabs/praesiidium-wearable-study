version: "3"

vars:
  IMAGE: wearable-risk-pipeline
  CONTAINER: wearable-risk-pipeline
  # Input data, Zenodo record https://doi.org/10.5281/zenodo.23344939
  # (model_I2O.checkpoint is tracked in git and not downloaded).
  RAW_SESSIONS_URL: '{{.RAW_SESSIONS_URL | default "https://zenodo.org/records/23344939/files/raw_sessions_final.zip?download=1"}}'
  X_TEST_URL: '{{.X_TEST_URL | default "https://zenodo.org/records/23344939/files/x_test.zip?download=1"}}'

tasks:
  setup:
    desc: Download and extract the input data (raw_sessions/, x_test.npy) into ./data
    preconditions:
      - sh: command -v unzip
        msg: "unzip is required -- install it first (e.g. sudo apt install unzip)"
    cmds:
      - mkdir -p data
      - curl -fL --progress-bar -o data/raw_sessions_final.zip "{{.RAW_SESSIONS_URL}}"
      - curl -fL --progress-bar -o data/x_test.zip "{{.X_TEST_URL}}"
      - unzip -q -o data/raw_sessions_final.zip -d data
      - unzip -q -o data/x_test.zip -d data
      - rm data/raw_sessions_final.zip data/x_test.zip
    status:
      - test -f data/x_test.npy
      - test -d data/raw_sessions

  build:
    desc: Build the Docker image
    cmds:
      - docker build -t {{.IMAGE}} .

  up:
    desc: Build the image and run the full pipeline (extra flags go after --, e.g. task up -- --draws 20)
    deps: [build]
    preconditions:
      - sh: test -f data/x_test.npy && test -d data/raw_sessions
        msg: "data/ is missing -- run `task setup` first"
      - sh: test -f data/model_I2O.checkpoint
        msg: "data/model_I2O.checkpoint is missing -- it is tracked in git, restore it with `git checkout -- data/model_I2O.checkpoint`"
    cmds:
      - mkdir -p output
      - docker rm -f {{.CONTAINER}} >/dev/null 2>&1 || true
      - >-
        docker run -d --name {{.CONTAINER}}
        --user "$(id -u):$(id -g)"
        -v "{{.ROOT_DIR}}/data:/app/data:ro"
        -v "{{.ROOT_DIR}}/output:/app/output"
        {{.IMAGE}} {{.CLI_ARGS}}
      - docker logs -f {{.CONTAINER}}

  down:
    desc: Stop and remove the pipeline container
    cmds:
      - docker rm -f {{.CONTAINER}} >/dev/null 2>&1 || true
